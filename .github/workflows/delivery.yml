name: Frontend delivery
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
      VITE_COGNITO_ISSUER: ${{ vars.VITE_COGNITO_ISSUER }}
      VITE_COGNITO_CLIENT_ID: ${{ vars.VITE_COGNITO_CLIENT_ID }}
      VITE_COGNITO_DOMAIN: ${{ vars.VITE_COGNITO_DOMAIN }}
      BACKEND_COMMIT: ${{ vars.BACKEND_COMMIT }}
      DATASET_COMMIT: ${{ vars.DATASET_COMMIT }}
      BEDROCK_MODEL_ID: ${{ vars.BEDROCK_MODEL_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run test:contract
      - if: github.event_name == 'workflow_dispatch'
        run: |
          [[ "$VITE_API_BASE_URL" == https://*/api/v1 ]]
          [[ "$VITE_COGNITO_ISSUER" == https://cognito-idp.ap-southeast-1.amazonaws.com/* ]]
          [[ "$VITE_COGNITO_DOMAIN" == https://*.auth.ap-southeast-1.amazoncognito.com ]]
          test -n "$VITE_COGNITO_CLIENT_ID"
          [[ "$BACKEND_COMMIT" =~ ^[a-f0-9]{40}$ ]]
          [[ "$DATASET_COMMIT" =~ ^[a-f0-9]{40}$ ]]
          node scripts/release-metadata.mjs
      - run: cd dist && zip -qr ../frontend.zip .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: frontend-${{ github.sha }}
          path: frontend.zip
          retention-days: 90
          if-no-files-found: error
  deploy:
    if: ${{ false }}
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: poc
    concurrency:
      group: bizzybee-frontend-poc
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: pip install boto3==1.42.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: frontend-${{ github.sha }}
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-southeast-1
          allowed-account-ids: '524097108092'
      - run: python scripts/deploy.py
        env:
          AMPLIFY_APP_ID: ${{ vars.AMPLIFY_APP_ID }}
